<div class="project-grid">

    <!-- LeetCode -->
    <div class="project-card" data-image="/img/algorithm/leetcode.jpg" onclick="openModal(this)">
        <span class="project-status status-wip">In Progress</span>
        <div class="card-face">
            <h3>LeetCode</h3>
            <div class="project-meta">Apr. 2026 – Present ·</div>
            <p class="card-summary">Solved 0+ problems on LeetCode</p>
        </div>
    </div>

    <!-- Baekjoon Online Judge -->
    <div class="project-card" data-image="/img/algorithm/boj.jpg" onclick="openModal(this)">
        <span class="project-status status-done">Done</span>
        <div class="card-face">
            <h3>BOJ</h3>
            <div class="project-meta">Jun. 2025 – Apr. 2026</div>
            <div class="project-tags">
                <span class="tag-boj-gold">Gold I</span>
            </div>
            <p class="card-summary">Solved 441 problems on BaekJoon using Python</p>
        </div>
    </div>

    <script>
        function openModal(card) {
            const title = card.querySelector('h3').innerHTML;
            const meta = card.querySelector('.project-meta').textContent;
            const tags = card.querySelector('.project-tags').innerHTML;
            const details = card.querySelector('.card-details').innerHTML;
            const status = card.querySelector('.project-status').outerHTML;
            const github = card.dataset.github;
            const image = card.dataset.image;

            document.getElementById('modal-status').innerHTML = status;
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-meta').textContent = meta;
            document.getElementById('modal-tags').innerHTML = tags;
            document.getElementById('modal-details').innerHTML = details;
            document.getElementById('modal-github').href = github;

            const gif = card.dataset.gif;
            const wrap = document.getElementById('modal-image-wrap');
            const img = document.getElementById('modal-image');
            if (gif || image) {
                wrap.classList.remove('no-image');
                if (gif && image) {
                    img.onerror = () => {
                        img.onerror = () => wrap.classList.add('no-image');
                        img.src = image;
                    };
                } else {
                    img.onerror = () => wrap.classList.add('no-image');
                }
                img.src = gif || image;
            } else {
                wrap.classList.add('no-image');
            }

            document.getElementById('project-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('project-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeModalOutside(e) {
            if (e.target === document.getElementById('project-modal')) closeModal();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        // hover preview (GIF 우선, 없으면 정적 이미지로 fallback)
        document.querySelectorAll('.project-card').forEach(card => {
            const gifSrc = card.dataset.gif;
            const imageSrc = card.dataset.image;
            if (!gifSrc && !imageSrc) return;

            const preview = document.createElement('div');
            preview.className = 'card-preview';
            const img = document.createElement('img');
            img.alt = 'preview';
            preview.appendChild(img);
            card.querySelector('.card-face').prepend(preview);

            let state = 'idle';

            const tryLoad = (src, fallback) => {
                img.onload = () => { state = 'loaded'; preview.classList.add('visible'); };
                img.onerror = () => {
                    if (fallback) tryLoad(fallback, null);
                    else state = 'failed';
                };
                img.src = src;
            };

            card.addEventListener('mouseenter', () => {
                if (state === 'failed') return;
                if (state === 'loaded') { preview.classList.add('visible'); return; }
                if (state === 'loading') return;
                state = 'loading';
                tryLoad(gifSrc || imageSrc, gifSrc && imageSrc ? imageSrc : null);
            });

            card.addEventListener('mouseleave', () => {
                preview.classList.remove('visible');
            });
        });
    </script>
